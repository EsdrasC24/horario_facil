{% extends 'horarios/base.html' %}

{% block content %}
<div class="container mx-auto p-4">
    <h2 class="text-2xl font-bold mb-4">Crear Estudiante</h2>
    <form method="post" class="max-w-md">
        {% csrf_token %}
        <div class="mb-4">
            <label for="{{ form.nombre.id_for_label }}" class="block font-medium text-gray-700">Nombre:</label>
            {{ form.nombre }}
            {% if form.nombre.errors %}
            <p class="text-red-500 text-sm">{{ form.nombre.errors.as_text }}</p>
            {% endif %}
        </div>
        <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
            Guardar
        </button>
    </form>
</div>
{% endblock %}
