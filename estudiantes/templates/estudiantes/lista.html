{% extends 'horarios/base.html' %}

{% block content %}
<div class="container mx-auto p-4">
    <h2 class="text-2xl font-bold mb-4">Listado de Estudiantes</h2>
    <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
            <thead>
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nombre</th>
                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                {% for estudiante in estudiantes %}
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap">{{ estudiante.nombre }}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-right font-medium">
                        <a href="{% url 'editar_estudiante' estudiante.pk %}" class="text-indigo-600 hover:text-indigo-900 mr-2">Editar</a>
                        <a href="{% url 'eliminar_estudiante' estudiante.pk %}" class="text-red-600 hover:text-red-900">Eliminar</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <a href="{% url 'crear_estudiante' %}" class="mt-4 inline-block bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Crear Nuevo Estudiante</a>
</div>
{% endblock %}
