{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Horarios{% endblock %}</title>
    <link href="{% static 'css/styles.css' %}" rel="stylesheet"> </head>
    <!-- <script src="https://cdn.tailwindcss.com/3.4.16"></script> -->
     <script src="{% static 'horarios/js/cdn.tailwindcss.js' %}"></script>

<body class="bg-gray-100">
    <header class="bg-blue-600 text-white shadow-lg">
        <div class="container mx-auto flex justify-between items-center py-4 px-6">
            <div class="text-2xl font-bold">
                <a href="#" class="hover:text-blue-200">HorarioFacil</a>
            </div>
            <nav class="space-x-4">
                <a href="{% url 'lista_asignaturas' %}" class="hover:text-blue-200">Asignaturas</a>
                <a href="{% url 'lista_estudiantes' %}" class="hover:text-blue-200">Estudiantes</a>
                <a href="" class="hover:text-blue-200">Configuración</a>
                <a href="{% url 'lista_horarios' %}" class="hover:text-blue-200">Horarios</a>
                <a href="" class="hover:text-blue-200">Cerrar Sesión</a>
            </nav>
        </div>
    </header>
    <div class="container mx-auto p-4 mt-8">
        {% block content %}
        {% endblock %}
    </div>
    <footer class="bg-gray-800 p-4 mt-8 text-center">
        <p class="text-white">&copy; 2025 Sistema de Horarios. Todos los derechos reservados.</p>
    </footer>
</body>

</html>
